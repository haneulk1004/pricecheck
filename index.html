<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <title>PRICE_CHECK | V100</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
    * { box-sizing: border-box; }
    body { margin:0; background:#000; color:#fff; font-family:'Inter','Noto Sans KR',sans-serif; }
    ::-webkit-scrollbar { width:6px; }
    ::-webkit-scrollbar-track { background:#000; }
    ::-webkit-scrollbar-thumb { background:#333; border-radius:3px; }
    .fade-in { animation:fadeIn .45s ease-out; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
    .spinner { width:42px; height:42px; border:4px solid rgba(255,255,255,.15); border-left-color:#fff; border-radius:50%; animation:spin .9s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .img-preview { width:100%; max-height:360px; object-fit:contain; background:#0a0a0a; border:1px solid #27272a; border-radius:16px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const EMPTY_PRODUCT = { brand:'', productName:'', modelCode:'', category:'', confidence:0, searchQuery:'' };

function App(){
  const [view,setView] = useState('home');
  const [mode,setMode] = useState('store');
  const [manualSearch,setManualSearch] = useState('');
  const [product,setProduct] = useState(EMPTY_PRODUCT);
  const [previewImg,setPreviewImg] = useState(null);
  const [isLoading,setIsLoading] = useState(false);
  const [errorMsg,setErrorMsg] = useState('');
  const [favorites,setFavorites] = useState([]);
  const cameraInputRef = useRef(null);
  const uploadInputRef = useRef(null);

  useEffect(()=>{
    try {
      const saved = JSON.parse(localStorage.getItem('priceCheckFavoritesV100') || '[]');
      if(Array.isArray(saved)) setFavorites(saved);
    } catch(e){}
  },[]);

  useEffect(()=>{
    localStorage.setItem('priceCheckFavoritesV100',JSON.stringify(favorites));
  },[favorites]);

  useEffect(()=>{
    if(window.lucide) requestAnimationFrame(()=>window.lucide.createIcons());
  },[view,mode,isLoading,favorites.length]);

  const goHome = ()=>{
    setView('home');
    setManualSearch('');
    setProduct(EMPTY_PRODUCT);
    setPreviewImg(null);
    setErrorMsg('');
  };

  const buildManualProduct = (name)=>({
    brand:'',
    productName:name.trim(),
    modelCode:'',
    category:'',
    confidence:100,
    searchQuery:name.trim()
  });

  const handleManualSearch = (e)=>{
    e.preventDefault();
    const q = manualSearch.trim();
    if(!q) return;
    setProduct(buildManualProduct(q));
    setErrorMsg('');
    setView('confirm');
  };

  const handleFile = (e)=>{
    const file = e.target.files?.[0];
    if(!file) return;
    if(!file.type.startsWith('image/')){
      setErrorMsg('이미지 파일만 업로드할 수 있습니다.');
      return;
    }
    if(file.size > 8 * 1024 * 1024){
      setErrorMsg('이미지는 8MB 이하로 업로드해주세요.');
      return;
    }
    const reader = new FileReader();
    reader.onload = ()=>{
      const dataUrl = reader.result;
      setPreviewImg(dataUrl);
      analyzeImage(dataUrl,file.type);
    };
    reader.readAsDataURL(file);
    e.target.value='';
  };

  const analyzeImage = async(dataUrl,mimeType)=>{
    setIsLoading(true);
    setErrorMsg('');
    try {
      const base64 = String(dataUrl).split(',')[1];
      const res = await fetch('/api/analyze',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ imageBase64:base64, mimeType })
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data?.error || 'AI 분석에 실패했습니다.');
      setProduct({
        brand:data.brand || '',
        productName:data.productName || '',
        modelCode:data.modelCode || '',
        category:data.category || '',
        confidence:Number(data.confidence || 0),
        searchQuery:data.searchQuery || [data.brand,data.productName,data.modelCode].filter(Boolean).join(' ')
      });
      setView('confirm');
    } catch(err){
      setErrorMsg(err.message || 'AI 분석에 실패했습니다.');
      setView('home');
    } finally {
      setIsLoading(false);
    }
  };

  const confirmProduct = ()=>{
    if(!product.productName.trim()){
      setErrorMsg('제품명을 입력해주세요.');
      return;
    }
    setView('mode');
  };

  const updateProduct = (key,value)=>setProduct(prev=>({ ...prev,[key]:value }));

  const favoriteKey = `${product.brand}|${product.productName}|${product.modelCode}`;
  const isFav = favorites.some(x=>x.key===favoriteKey);
  const toggleFavorite = ()=>{
    if(isFav) setFavorites(favorites.filter(x=>x.key!==favoriteKey));
    else setFavorites([{key:favoriteKey,...product,savedAt:Date.now()},...favorites].slice(0,50));
  };

  const openFavorite = (item)=>{
    setProduct(item);
    setPreviewImg(null);
    setView('mode');
  };

  const ModeButton = ({type,title,desc,icon})=>(
    <button onClick={()=>{setMode(type);setView('result')}} className="text-left p-7 md:p-9 rounded-2xl border border-zinc-800 bg-zinc-950 hover:border-white transition-all group">
      <div className="flex items-center justify-between mb-8">
        <div className="w-12 h-12 rounded-full bg-white text-black flex items-center justify-center"><i data-lucide={icon}></i></div>
        <i data-lucide="arrow-up-right" className="text-zinc-600 group-hover:text-white"></i>
      </div>
      <h3 className="text-2xl md:text-3xl font-black tracking-tight mb-3">{title}</h3>
      <p className="text-sm text-zinc-500 leading-6">{desc}</p>
    </button>
  );

  if(isLoading){
    return <div className="min-h-screen flex flex-col items-center justify-center gap-6 px-6"><div className="spinner"></div><p className="text-sm font-black tracking-[.2em] uppercase">AI Product Identification</p><p className="text-xs text-zinc-600">브랜드, 제품명, 모델 코드를 분석하고 있습니다.</p></div>
  }

  return <div className="min-h-screen bg-black">
    <nav className="fixed top-0 left-0 right-0 z-50 bg-black/90 backdrop-blur-xl border-b border-zinc-900">
      <div className="max-w-6xl mx-auto px-5 md:px-8 h-20 flex items-center justify-between">
        <button onClick={goHome} className="font-black italic tracking-tighter text-xl">PRICE_CHECK <span className="text-[10px] text-zinc-500 not-italic">V100</span></button>
        <button onClick={()=>setView('saved')} className="relative p-2 text-zinc-400 hover:text-white"><i data-lucide="folder-heart"></i>{favorites.length>0 && <span className="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>}</button>
      </div>
    </nav>

    {view==='home' && <main className="min-h-screen max-w-6xl mx-auto px-6 md:px-8 pt-36 pb-16 flex flex-col justify-center fade-in">
      <div className="mb-12">
        <p className="text-xs font-black tracking-[.3em] text-zinc-500 uppercase mb-5">AI-assisted price verification</p>
        <h1 className="text-6xl md:text-[9rem] leading-[.84] font-black tracking-[-.07em] italic">SEE IT.<br/><span className="text-zinc-700">CHECK IT.</span></h1>
        <p className="mt-8 text-zinc-400 max-w-2xl leading-7">매장에서 발견한 제품을 촬영하면 AI가 제품을 식별합니다. 이후 실제 온라인 판매처와 리셀 플랫폼에서 직접 가격을 검증하세요.</p>
      </div>

      {errorMsg && <div className="mb-6 border border-red-900 bg-red-950/30 text-red-300 rounded-xl px-5 py-4 text-sm">{errorMsg}</div>}

      <form onSubmit={handleManualSearch} className="flex flex-col md:flex-row gap-3 mb-4">
        <input value={manualSearch} onChange={e=>setManualSearch(e.target.value)} placeholder="제품명 또는 모델명을 직접 입력" className="flex-1 bg-zinc-950 border border-zinc-800 rounded-xl px-5 py-5 text-lg font-bold outline-none focus:border-white" />
        <button className="bg-white text-black rounded-xl px-9 py-5 font-black">SEARCH</button>
      </form>

      <div className="grid grid-cols-2 gap-3">
        <button onClick={()=>cameraInputRef.current?.click()} className="border border-zinc-700 rounded-xl p-5 font-black flex items-center justify-center gap-3 hover:bg-white hover:text-black transition-all"><i data-lucide="camera"></i> 사진 촬영</button>
        <button onClick={()=>uploadInputRef.current?.click()} className="border border-zinc-800 rounded-xl p-5 font-black flex items-center justify-center gap-3 text-zinc-400 hover:text-white hover:border-white transition-all"><i data-lucide="upload"></i> 이미지 업로드</button>
      </div>
    </main>}

    {view==='confirm' && <main className="max-w-4xl mx-auto px-6 md:px-8 pt-32 pb-20 fade-in">
      <div className="mb-8"><p className="text-xs tracking-[.25em] text-zinc-500 font-black uppercase">AI Identification</p><h2 className="text-4xl md:text-6xl font-black mt-3 tracking-tight">이 제품이 맞나요?</h2></div>
      <div className="grid md:grid-cols-2 gap-6">
        <div>{previewImg ? <img src={previewImg} className="img-preview"/> : <div className="h-full min-h-[260px] rounded-2xl border border-zinc-800 bg-zinc-950 flex items-center justify-center text-zinc-700"><i data-lucide="search" className="w-16 h-16"></i></div>}</div>
        <div className="border border-zinc-800 rounded-2xl p-6 bg-zinc-950">
          <label className="block text-[10px] text-zinc-500 font-black tracking-[.2em] mb-2">BRAND</label><input value={product.brand} onChange={e=>updateProduct('brand',e.target.value)} className="w-full bg-black border border-zinc-800 rounded-lg p-3 mb-5 font-bold outline-none focus:border-white" placeholder="브랜드"/>
          <label className="block text-[10px] text-zinc-500 font-black tracking-[.2em] mb-2">PRODUCT</label><input value={product.productName} onChange={e=>updateProduct('productName',e.target.value)} className="w-full bg-black border border-zinc-800 rounded-lg p-3 mb-5 font-bold outline-none focus:border-white" placeholder="제품명"/>
          <label className="block text-[10px] text-zinc-500 font-black tracking-[.2em] mb-2">MODEL / SKU</label><input value={product.modelCode} onChange={e=>updateProduct('modelCode',e.target.value)} className="w-full bg-black border border-zinc-800 rounded-lg p-3 mb-5 font-bold outline-none focus:border-white" placeholder="모델 코드"/>
          {previewImg && <div className="flex justify-between items-center bg-black border border-zinc-900 rounded-lg px-4 py-3 mb-6"><span className="text-xs text-zinc-500">AI 식별 신뢰도</span><strong>{Math.max(0,Math.min(100,product.confidence))}%</strong></div>}
          {errorMsg && <p className="text-red-400 text-sm mb-4">{errorMsg}</p>}
          <div className="flex gap-3"><button onClick={goHome} className="flex-1 border border-zinc-700 rounded-lg py-4 font-bold text-zinc-400">다시 찾기</button><button onClick={confirmProduct} className="flex-[2] bg-white text-black rounded-lg py-4 font-black">맞아요</button></div>
        </div>
      </div>
    </main>}

    {view==='mode' && <main className="max-w-5xl mx-auto px-6 md:px-8 pt-32 pb-20 fade-in">
      <p className="text-xs tracking-[.25em] text-zinc-500 font-black mb-3">NEXT STEP</p>
      <h2 className="text-4xl md:text-6xl font-black tracking-tight mb-3">무엇을 확인할까요?</h2>
      <p className="text-zinc-500 mb-10">{[product.brand,product.productName,product.modelCode].filter(Boolean).join(' · ')}</p>
      <div className="grid md:grid-cols-2 gap-5"><ModeButton type="store" title="매장 가격검증" desc="현재 매장 판매가와 주요 온라인 쇼핑몰의 실제 검색 결과를 비교합니다." icon="store"/><ModeButton type="resell" title="리셀 시세" desc="사이즈를 선택하고 KREAM·SOLDOUT 등 리셀 플랫폼에서 실제 시세를 확인합니다." icon="refresh-cw"/></div>
    </main>}

    {view==='result' && <ResultView product={product} mode={mode} onBack={()=>setView('mode')} onFavorite={toggleFavorite} isFav={isFav} />}

    {view==='saved' && <main className="max-w-5xl mx-auto px-6 md:px-8 pt-32 pb-20 fade-in"><div className="flex items-center gap-4 mb-10"><button onClick={goHome}><i data-lucide="arrow-left"></i></button><h2 className="text-4xl font-black">Saved</h2></div>{favorites.length===0 ? <div className="py-24 text-center text-zinc-600">저장된 제품이 없습니다.</div> : <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-4">{favorites.map(item=><button key={item.key} onClick={()=>openFavorite(item)} className="text-left border border-zinc-800 bg-zinc-950 hover:border-white rounded-xl p-5"><p className="text-xs text-zinc-500 mb-2">{item.brand || 'PRODUCT'}</p><p className="font-black text-lg">{item.productName}</p><p className="text-xs text-zinc-600 mt-2">{item.modelCode}</p></button>)}</div>}</main>}

    <input ref={cameraInputRef} type="file" accept="image/*" capture="environment" onChange={handleFile} className="hidden" />
    <input ref={uploadInputRef} type="file" accept="image/*" onChange={handleFile} className="hidden" />
  </div>
}

function ResultView({product,mode,onBack,onFavorite,isFav}){
  const [storePrice,setStorePrice] = useState('');
  const [size,setSize] = useState(270);
  const sizes = [230,240,250,260,270,280,290];
  const baseQuery = [product.brand,product.productName,product.modelCode].filter(Boolean).join(' ');
  const query = mode==='resell' ? `${baseQuery} ${size}` : baseQuery;
  const storeMalls = [
    ['NAVER',`https://search.shopping.naver.com/search/all?query=${encodeURIComponent(query)}`],
    ['COUPANG',`https://www.coupang.com/np/search?q=${encodeURIComponent(query)}`],
    ['SSG',`https://www.ssg.com/search.ssg?query=${encodeURIComponent(query)}`],
    ['11ST',`https://search.11st.co.kr/Search.tmall?kwd=${encodeURIComponent(query)}`],
    ['GMARKET',`https://browse.gmarket.co.kr/search?keyword=${encodeURIComponent(query)}`]
  ];
  const resellMalls = [
    ['KREAM',`https://kream.co.kr/search?keyword=${encodeURIComponent(query)}`],
    ['SOLDOUT',`https://www.soldout.co.kr/search/product/list?keyword=${encodeURIComponent(query)}`],
    ['MUSINSA',`https://www.musinsa.com/search/goods?keyword=${encodeURIComponent(query)}`],
    ['NAVER',`https://search.shopping.naver.com/search/all?query=${encodeURIComponent(query)}`]
  ];
  const malls = mode==='resell' ? resellMalls : storeMalls;
  useEffect(()=>{ if(window.lucide) requestAnimationFrame(()=>window.lucide.createIcons()); },[mode,size,isFav]);
  return <main className="max-w-6xl mx-auto px-6 md:px-8 pt-32 pb-24 fade-in">
    <div className="flex items-center justify-between mb-10"><button onClick={onBack} className="text-sm text-zinc-400 flex gap-2 items-center"><i data-lucide="arrow-left" className="w-4 h-4"></i> 모드 선택</button><button onClick={onFavorite} className="p-3 border border-zinc-800 rounded-full"><i data-lucide="heart" className={isFav?'fill-red-500 text-red-500':''}></i></button></div>
    <div className="border-l-8 border-white pl-6 mb-10"><p className="text-xs text-zinc-500 tracking-[.2em] font-black mb-3">{mode==='store'?'STORE PRICE CHECK':'RESELL MARKET'}</p><h2 className="text-4xl md:text-6xl font-black tracking-tight">{product.productName}</h2><p className="text-zinc-500 mt-3">{[product.brand,product.modelCode].filter(Boolean).join(' · ')}</p></div>
    {mode==='store' ? <div className="border border-zinc-800 bg-zinc-950 rounded-2xl p-6 mb-8"><label className="text-xs font-black text-zinc-500 tracking-[.15em]">매장에서 본 가격</label><div className="flex items-center gap-3 mt-3"><span className="text-2xl font-black">₩</span><input inputMode="numeric" value={storePrice} onChange={e=>setStorePrice(e.target.value.replace(/\D/g,''))} placeholder="219000" className="flex-1 bg-black border border-zinc-800 rounded-lg px-4 py-4 text-2xl font-black outline-none focus:border-white"/></div></div> : <div className="border border-zinc-800 bg-zinc-950 rounded-2xl p-6 mb-8"><p className="text-xs font-black text-zinc-500 tracking-[.15em] mb-4">SIZE / KR mm</p><div className="flex flex-wrap gap-2">{sizes.map(s=><button key={s} onClick={()=>setSize(s)} className={`px-4 py-3 rounded-full border text-sm font-black ${size===s?'bg-white text-black border-white':'border-zinc-700 text-zinc-400'}`}>{s}</button>)}</div></div>}
    <PriceResearch key={JSON.stringify([baseQuery,mode,size])} product={product} mode={mode} size={size} storePrice={storePrice} />
    <div className="mb-4 flex items-end justify-between"><div><p className="text-xs text-zinc-600 font-bold">실제 가격은 각 판매처에서 확인합니다.</p><p className="text-sm text-zinc-400 mt-1">검색어: {query}</p></div>{mode==='store'&&storePrice&&<div className="text-right"><p className="text-[10px] text-zinc-600">STORE PRICE</p><p className="font-black text-xl">₩ {Number(storePrice).toLocaleString()}</p></div>}</div>
    <div className="grid md:grid-cols-2 gap-3">{malls.map(([name,url])=><a key={name} href={url} target="_blank" rel="noopener noreferrer" className="border border-zinc-800 hover:border-white rounded-xl p-6 flex items-center justify-between group"><div><p className="font-black text-xl">{name}</p><p className="text-xs text-zinc-600 mt-1">실제 검색 결과 열기</p></div><i data-lucide="arrow-up-right" className="text-zinc-600 group-hover:text-white"></i></a>)}</div>
  </main>
}

function PriceResearch({product,mode,size,storePrice}){
  const [result,setResult] = useState(null);
  const [busy,setBusy] = useState(false);
  const [error,setError] = useState('');
  const requestRef = useRef(null);
  useEffect(()=>()=>requestRef.current?.abort(),[]);
  const research = async()=>{
    if(requestRef.current) return;
    const controller = new AbortController();
    requestRef.current = controller;
    const timeout = setTimeout(()=>controller.abort(),58000);
    setBusy(true); setError(''); setResult(null);
    try {
      const response = await fetch('/api/research',{
        method:'POST',headers:{'Content-Type':'application/json'},signal:controller.signal,
        body:JSON.stringify({brand:product.brand,productName:product.productName,modelCode:product.modelCode,mode,size:String(size)})
      });
      const data = await response.json();
      if(!response.ok) throw new Error(data.error || '가격 조사를 완료하지 못했습니다.');
      setResult(data);
    } catch(err){
      setError(err.name==='AbortError'?'조사 시간이 초과됐습니다. 잠시 후 다시 시도해주세요.':err.message);
    } finally {
      clearTimeout(timeout); requestRef.current=null; setBusy(false);
    }
  };
  return <section className="border border-zinc-700 bg-zinc-950 rounded-2xl p-6 mb-8" aria-label="실시간 가격 조사">
    <div className="flex flex-col sm:flex-row gap-5 sm:items-center sm:justify-between">
      <div><h3 className="text-xl font-black">출처로 확인하는 가격</h3><p className="text-xs text-zinc-400 mt-2 leading-6">Google 검색으로 공개된 판매가를 조사합니다.<br/>새 조사: IP당 하루 5회 · 전체 하루 300회 · 한국시간 자정 초기화<br/>같은 제품·모드·사이즈의 결과는 24시간 재사용하며 횟수를 차감하지 않습니다.</p></div>
      <button onClick={research} disabled={busy} className="bg-white text-black font-black rounded-xl px-6 py-4 disabled:opacity-50 disabled:cursor-wait whitespace-nowrap">{busy?'가격 조사 중…':'실시간 가격 조사'}</button>
    </div>
    <div aria-live="polite" aria-busy={busy}>
      {busy && <p className="text-sm text-zinc-400 mt-5">판매가와 출처를 확인하고 있습니다. 최대 1분 정도 걸릴 수 있습니다.</p>}
      {error && <p role="alert" className="text-sm text-amber-300 mt-5">{error}</p>}
      {result && <div className="mt-6">
        <p className="text-xs text-zinc-400 mb-4">{result.cached?'24시간 캐시 결과 · 추가 차감 없음':'새 조사 완료'} · 조사 시각: {new Date(result.researchedAt).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})} (한국시간){Number.isInteger(result.remaining)&&` · 오늘 남은 새 조사 ${result.remaining}회`}</p>
        <div className="grid md:grid-cols-2 gap-3">{result.offers.map((offer,index)=><article key={index} className="border border-zinc-800 bg-black rounded-xl p-5">
          <p className="font-black">{offer.seller}</p><p className="text-sm text-zinc-400 mt-2">{offer.productName}</p>
          <p className="text-3xl font-black my-4">₩ {offer.priceKRW.toLocaleString('ko-KR')}</p>
          {mode==='store'&&Number(storePrice)>0&&<p className="text-xs text-zinc-400 mb-3">입력한 매장가 대비 {Math.abs(Number(storePrice)-offer.priceKRW).toLocaleString('ko-KR')}원 {Number(storePrice)>offer.priceKRW?'낮음':Number(storePrice)<offer.priceKRW?'높음':'차이'}</p>}
          <p className="text-xs text-zinc-400 leading-6">{offer.condition} · {offer.note}</p>
          <ul className="mt-4 space-y-2">{offer.sources.map((source,i)=><li key={i}><a href={source.url} target="_blank" rel="noopener noreferrer" className="text-sm underline underline-offset-4 break-all">출처 {i+1}: {source.title} ↗</a></li>)}</ul>
        </article>)}</div>
        <p className="text-xs text-zinc-500 mt-4 leading-6">검색에서 확인된 공개 가격입니다. 옵션·배송비·재고·거래 조건에 따라 달라질 수 있으므로 출처에서 최종 확인해주세요.</p>
        {result.searchSuggestionsHtml && <iframe title="Google 검색 제안" sandbox="allow-popups allow-popups-to-escape-sandbox" referrerPolicy="no-referrer" srcDoc={result.searchSuggestionsHtml} className="w-full mt-4 border-0 rounded-lg bg-white" style={{height:180}} />}
      </div>}
    </div>
  </section>
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
